apiVersion: apps/v1
kind: {{ if .Values.cluster.disk.enabled }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.cluster.disk.enabled }}
  # stateful shards: stable ordinal identities + a PV per pod (--disk), so a
  # rebooted pod reboots onto its disk (same announce, same data)
  serviceName: {{ if .Values.cluster.peersService }}{{ .Values.cluster.peersService }}{{ else }}{{ .Release.Name }}-hs{{ end }}
  {{- else }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.env (and .Values.cluster.enabled .Values.cluster.peersService) }}
          env:
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            {{- if and .Values.cluster.enabled .Values.cluster.peersService }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          command: ["/zap", "serve", "--bind", "0.0.0.0:{{ .Values.service.targetPort }}"]
          args:
            {{- if .Values.serve.lanes }}
            - --lanes={{ .Values.serve.lanes }}
            {{- end }}
            - --top-k={{ .Values.serve.topK }}
            - --k1={{ .Values.serve.k1 }}
            - --b={{ .Values.serve.b }}
            {{- if .Values.serve.noStem }}
            - --no-stem
            {{- end }}
            {{- if and .Values.cluster.enabled .Values.cluster.peersService }}
            - --peers={{ .Values.cluster.peersService }}:{{ .Values.service.targetPort }}
            - --announce=$(POD_IP):{{ .Values.service.targetPort }}
            {{- end }}
            {{- if and .Values.cluster.enabled .Values.cluster.resync }}
            - --resync
            {{- end }}
            {{- if .Values.cluster.disk.enabled }}
            - --disk=/zap-data
            {{- end }}
            {{- if .Values.corpus.configMap }}
            - /corpus
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or .Values.corpus.configMap .Values.cluster.disk.enabled }}
          volumeMounts:
            {{- if .Values.corpus.configMap }}
            - name: corpus
              mountPath: /corpus
              readOnly: true
            {{- end }}
            {{- if .Values.cluster.disk.enabled }}
            - name: zap-data
              mountPath: /zap-data
            {{- end }}
          {{- end }}
          {{- with .Values.health.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.health.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.corpus.configMap }}
      volumes:
        - name: corpus
          configMap:
            name: {{ .Values.corpus.configMap }}
      {{- end }}
{{- if .Values.cluster.disk.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: zap-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.cluster.disk.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cluster.disk.size }}
{{- end }}
