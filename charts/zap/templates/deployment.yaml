apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.env (and .Values.cluster.enabled .Values.cluster.peersService) }}
          env:
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            {{- if and .Values.cluster.enabled .Values.cluster.peersService }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          command: ["/zap", "serve", "--bind", "0.0.0.0:{{ .Values.service.targetPort }}"]
          args:
            {{- if .Values.serve.lanes }}
            - --lanes={{ .Values.serve.lanes }}
            {{- end }}
            - --top-k={{ .Values.serve.topK }}
            - --k1={{ .Values.serve.k1 }}
            - --b={{ .Values.serve.b }}
            {{- if .Values.serve.noStem }}
            - --no-stem
            {{- end }}
            {{- if and .Values.cluster.enabled .Values.cluster.peersService }}
            - --peers={{ .Values.cluster.peersService }}:{{ .Values.service.targetPort }}
            - --announce=$(POD_IP):{{ .Values.service.targetPort }}
            {{- if and .Values.cluster.resync .Values.corpus.configMap }}
            {{- /* a corpus-backed pod is never empty at boot, so --resync would
                  be skipped by the engine's empty check — only add the flag on
                  corpus-free shards where a join actually pulls the ring share */}}
            {{- end }}
            {{- if and .Values.cluster.resync (not .Values.corpus.configMap) }}
            - --resync
            {{- end }}
            {{- end }}
            {{- if .Values.corpus.configMap }}
            - /corpus
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.corpus.configMap }}
          volumeMounts:
            - name: corpus
              mountPath: /corpus
              readOnly: true
          {{- end }}
          {{- with .Values.health.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.health.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.corpus.configMap }}
      volumes:
        - name: corpus
          configMap:
            name: {{ .Values.corpus.configMap }}
      {{- end }}
